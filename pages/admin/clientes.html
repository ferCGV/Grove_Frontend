            </div>

                <button id="botonconfirmfiltro">Confirmar</button>
                <button  id="botoncerrar">Cerrar</button>
            </div>
        </div>
        
        <table>
            <thead>
                <th>ID cliente</th>
                <th>Nombre cliente</th>
                <th>Telefono cliente</th>
                <th>Fecha registro</th>
        
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </div>

<script src="/js/admin/clientes.js">
</script>

</html>
