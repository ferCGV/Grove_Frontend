<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servicios | Grove Barbería</title>
  <link rel="stylesheet" href="/css/services.css" />
</head>
<body>
  <main class="servicios-container">
    <section class="servicio">
      <div class="info">
        <h2>Corte de cabello</h2>
        <ul>
          <li>Normal o Fade</li>
          <li>Peinado con cera o gel</li>
          <li>Masaje relajante express</li>
          <li>Agua de cortesía</li>
        </ul>
        <p class="precio">Todo por <strong>$120</strong></p>
        <button>Agendar</button>
      </div>
      <div class="carrusel">
        <img src="assets/imgs/corte1.jpg" alt="Corte 1" class="active" />
        <img src="assets/imgs/corte2.jpg" alt="Corte 2" />
        <img src="assets/imgs/corte3.jpg" alt="Corte 3" />
        <div class="flechas">
          <button class="prev">‹</button>
          <button class="next">›</button>
        </div>
      </div>
    </section>

    <section class="servicio">
      <div class="info">
        <h2>Barba</h2>
        <ul>
          <li>Afeitado o delineado</li>
          <li>Rebajado de barba y bigote</li>
          <li>Ritual de toallas (fría y caliente)</li>
          <li>Exfoliación facial</li>
          <li>Agua de cortesía</li>
        </ul>
        <p class="precio">Todo por <strong>$120</strong></p>
        <button>Agendar</button>
      </div>
      <div class="carrusel">
        <img src="/assets/imgs/haircut.jpg" alt="Barba 1" class="active" />
        <img src="/assets/imgs/imggrove2.jpeg" alt="Barba 2" />
        <img src="/assets/imgs/imggrove3.jpeg" alt="Barba 3" />
        <div class="flechas">
          <button class="prev">‹</button>
          <button class="next">›</button>
        </div>
      </div>
    </section>
  </main>
  <script src="js/servicios.js"></script>
</body>
<script src="/js/services.js" ></script>
</html>
