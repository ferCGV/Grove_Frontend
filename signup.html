<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <header>
        <nav id="navbar">
            <div class="logo">
                <img src="assets/imgs/Logogrove.jpg" alt="Logo de Grove" />
                <h1>GROVE</h1>
            </div>
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="#servicios">Servicios</a>
                <a href="agendar.html" target="_blank">Agendar</a>
                <a href="#">Ubicación</a>
                <a href="#">Horario</a>
                <a href="signup.html" class="linregister" >Registrarse</a>
                <a href="login.html" class="linlogin">Iniciar sesión</a>     
            </div>
        </nav>
     
    </header>
    
    <form action="" id="form" >
        <h2>Registrate</h2>
        <input id="nombre" type="text" placeholder="nombre" required>
        <input id="email" type="email" placeholder="email" required>
        <input id="telefono" type="tel" placeholder="telefono" required>
        <input id="contraseña" type="password" placeholder="contraseña" required>
        <button id="confirm"  type="submit">Confirmar</button>
    </form>
    
</body>


<script type="module" src="js/signup.js"></script>
</html>
